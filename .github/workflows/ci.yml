name: CI

on:
  push:
  pull_request:
    branches: [dev, prod]

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command: [check, test, 'test:pages']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.command }}
